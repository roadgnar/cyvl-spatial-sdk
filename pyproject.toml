[project]
name = "cyvl"
version = "0.1.0"
description = "Build on Cyvl's physical-world data: street imagery, LiDAR, and infrastructure layers with full 3D<->2D projection"
readme = "README.md"
authors = [{ name = "Cyvl", email = "hello@cyvl.ai" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "geopandas>=1.0",
    "laspy[lazrs]>=2.5",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pandas>=2.0",
    "pyarrow>=14",
    "pyproj>=3.6",
    "requests>=2.31",
    "shapely>=2.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7", "folium>=0.15"]
sam = ["fal-client>=0.5"]
dev = ["pytest>=8", "pytest-cov", "ruff"]

[project.urls]
Homepage = "https://github.com/cyvl/cyvl-sdk"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyvl"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
